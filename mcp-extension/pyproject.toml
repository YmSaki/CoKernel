[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cokernel-mcp-extension"
version = "0.1.0"
description = "CoKernel same-kernel invariants for Jupyter MCP Server"
requires-python = ">=3.12"
dependencies = [
  "jupyter-mcp-server==2.1.12",
]

[project.entry-points."jupyter_mcp_server.extensions"]
zz-cokernel-session-attach = "cokernel_mcp_extension.plugin:CoKernelSessionAttachExtension"

[tool.hatch.build.targets.wheel]
packages = ["cokernel_mcp_extension"]
