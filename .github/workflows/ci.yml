name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify normalized Windows-script blobs
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(
              ['git', 'ls-files', '*.cmd', '*.ps1'], text=True
          ).splitlines()
          bad = []
          for path in files:
              blob = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              if b'\r' in blob:
                  bad.append(path)
          if bad:
              raise SystemExit(
                  'Tracked Windows-script blobs must be LF-normalized; .gitattributes '
                  'will materialize CRLF on Windows. Bad files: ' + ', '.join(bad)
              )
          PY

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck up.sh down.sh logs.sh scripts/*.sh

      - name: Compile MCP extension
        run: python -m compileall -q mcp-extension/cokernel_mcp_extension

      - name: Test same-kernel session resolver
        run: PYTHONPATH=mcp-extension python -m unittest discover -s mcp-extension/tests -v

      - name: Prepare non-secret CI environment
        run: |
          cp .env.example .env
          sed -i 's/^JUPYTER_TOKEN=$/JUPYTER_TOKEN=ci-jupyter-token/' .env
          sed -i 's/^MCP_TOKEN=$/MCP_TOKEN=ci-mcp-token/' .env

      - name: Verify CRLF env repair
        run: |
          sed -i 's/$/\r/' .env
          ./scripts/init-env.sh
          if grep -q $'\r' .env; then
            echo '.env still contains CR characters after init-env.sh'
            exit 1
          fi
          test "$(awk -F= '$1 == "GPU_TEST_IMAGE" {print $2}' .env)" = "nvidia/cuda:12.8.1-base-ubuntu24.04"

      - name: Validate Compose model
        run: docker compose --profile tunnel config >/dev/null

      - name: Build MCP image
        run: docker compose build mcp

      - name: Verify pinned tunnel image exists
        run: docker compose --profile tunnel pull tunnel

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse PowerShell installers
        shell: powershell
        run: |
          foreach ($file in @('.\install.ps1', '.\install-elevated.ps1', '.\sync-wsl-repo.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ('{0}: {1}' -f $file, $_.Message) }
              exit 1
            }
          }

      - name: Check bootstrap entrypoints
        shell: powershell
        run: |
          if (-not (Test-Path .\install.cmd)) { throw 'install.cmd missing' }
          if (-not (Test-Path .\install.ps1)) { throw 'install.ps1 missing' }
          if (-not (Test-Path .\install-elevated.ps1)) { throw 'install-elevated.ps1 missing' }
          if (-not (Test-Path .\sync-wsl-repo.ps1)) { throw 'sync-wsl-repo.ps1 missing' }
          if (-not (Test-Path .\scripts\harden-wsl.sh)) { throw 'harden-wsl.sh missing' }
          if (-not (Test-Path .\scripts\bootstrap-ubuntu.sh)) { throw 'bootstrap-ubuntu.sh missing' }
