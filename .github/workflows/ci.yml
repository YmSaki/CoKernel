name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify normalized Windows-script blobs
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(
              ['git', 'ls-files', '*.cmd', '*.ps1'], text=True
          ).splitlines()
          bad = []
          for path in files:
              blob = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              if b'\r' in blob:
                  bad.append(path)
          if bad:
              raise SystemExit(
                  'Tracked Windows-script blobs must be LF-normalized; .gitattributes '
                  'will materialize CRLF on Windows. Bad files: ' + ', '.join(bad)
              )
          PY

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck up.sh down.sh logs.sh scripts/*.sh

      - name: Compile MCP extension
        run: python -m compileall -q mcp-extension/cokernel_mcp_extension

      - name: Test same-kernel session resolver
        run: PYTHONPATH=mcp-extension python -m unittest discover -s mcp-extension/tests -v

      - name: Prepare non-secret CI environment
        run: |
          cp .env.example .env
          sed -i 's/^JUPYTER_TOKEN=$/JUPYTER_TOKEN=ci-jupyter-token/' .env
          sed -i 's/^MCP_TOKEN=$/MCP_TOKEN=ci-mcp-token/' .env

      - name: Verify CRLF env repair
        run: |
          sed -i 's/$/\r/' .env
          ./scripts/init-env.sh
          if grep -q $'\r' .env; then
            echo '.env still contains CR characters after init-env.sh'
            exit 1
          fi
          test "$(awk -F= '$1 == "GPU_TEST_IMAGE" {print $2}' .env)" = "nvidia/cuda:12.8.1-base-ubuntu24.04"

      - name: Validate Compose model
        run: |
          docker compose --profile tunnel config >/dev/null
          docker compose config | grep -q 'published: "18888"'
          docker compose config | grep -q 'published: "14040"'

      - name: Build MCP image
        run: docker compose build mcp

      - name: Verify tunnel Host transport security
        run: |
          docker run --rm -i --entrypoint python cokernel/mcp:local - <<'PY'
          from cokernel_mcp_extension.plugin import configure_cokernel_transport_security

          class DummyMCP:
              def streamable_http_app(self, *args, **kwargs):
                  return kwargs

          mcp = DummyMCP()
          configure_cokernel_transport_security(mcp)
          wrapped = mcp.streamable_http_app
          kwargs = wrapped(stateless_http=True)
          security = kwargs["transport_security"]

          assert security.enable_dns_rebinding_protection is True
          assert "mcp" in security.allowed_hosts
          assert "mcp:*" in security.allowed_hosts
          assert "127.0.0.1:*" in security.allowed_hosts
          assert "http://localhost:*" in security.allowed_origins

          configure_cokernel_transport_security(mcp)
          assert mcp.streamable_http_app is wrapped
          PY

      - name: Verify pinned tunnel image exists
        run: docker compose --profile tunnel pull tunnel

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse PowerShell entrypoints
        shell: powershell
        run: |
          foreach ($file in @(
            '.\install.ps1',
            '.\install-elevated.ps1',
            '.\sync-wsl-repo.ps1',
            '.\update.ps1',
            '.\runtime.ps1',
            '.\runtime-keeper.ps1',
            '.\verify-windows-loopback.ps1',
            '.\apps\desktop\publish.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ('{0}: {1}' -f $file, $_.Message) }
              exit 1
            }
          }

      - name: Check bootstrap, update, runtime, and desktop entrypoints
        shell: powershell
        run: |
          foreach ($file in @(
            '.\install.cmd',
            '.\install.ps1',
            '.\install-elevated.ps1',
            '.\update.cmd',
            '.\update.ps1',
            '.\start.cmd',
            '.\stop.cmd',
            '.\status.cmd',
            '.\runtime.ps1',
            '.\runtime-keeper.ps1',
            '.\sync-wsl-repo.ps1',
            '.\verify-windows-loopback.ps1',
            '.\scripts\harden-wsl.sh',
            '.\scripts\bootstrap-ubuntu.sh',
            '.\scripts\configure-wsl-loopback-proxy.sh',
            '.\scripts\set-tunnel-config.sh',
            '.\scripts\update.sh',
            '.\apps\desktop\CoKernel.Desktop\CoKernel.Desktop.csproj',
            '.\installer\windows\CoKernel.iss'
          )) {
            if (-not (Test-Path $file)) { throw "$file missing" }
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build CoKernel Desktop
        shell: powershell
        run: dotnet build .\apps\desktop\CoKernel.Desktop\CoKernel.Desktop.csproj -c Release

      - name: Publish CoKernel Desktop
        shell: powershell
        run: .\apps\desktop\publish.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build CoKernelSetup.exe
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\windows\CoKernel.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CoKernelSetup-win-x64
          path: dist/installer/CoKernelSetup.exe
          if-no-files-found: error
