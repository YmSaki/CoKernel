name: v1

on:
  push:
    branches:
      - cokernel-v1
      - 'v1/**'
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  rust-windows:
    name: Rust workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows build
        run: cargo check --workspace --all-targets

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Sync worker development environment
        working-directory: worker
        run: uv sync --dev
      - name: Worker entrypoint smoke
        working-directory: worker
        run: uv run cokernel-worker --version
      - name: Worker execution semantics
        working-directory: worker
        run: uv run pytest
      - name: uv Project + worker overlay spike
        run: python scripts/v1/spike_uv_worker_overlay.py
      - name: Worker SIGINT survival spike
        run: python scripts/v1/spike_worker_interrupt.py

  protocol-fixtures:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON fixtures
        run: python scripts/v1/validate_protocol_fixtures.py
